[package]
name = "packjni"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "packjni"
crate-type = ["cdylib"]

[dependencies]
# Pinned: the spike (docs/poc/spike) proved this exact commit.
pack-api = { git = "https://github.com/google/pack", rev = "7b60931", features = ["cert-gen"] }
jni = "0.21.1"
# Same versions pack-sign uses, so the dependency tree stays one copy of each.
rsa = "0.9.9"
pem = "3.0.5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "unwind" # panics are caught in lib.rs and turned into PackException

# Stand-alone crate: never part of a parent workspace.
[workspace]
