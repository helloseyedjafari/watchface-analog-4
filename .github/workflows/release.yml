name: Release

# Tag the repo (e.g. `git tag v1.0.0 && git push --tags`) to build the watch face
# and publish a GitHub Release with the installable APK attached.
#
# Signed release APK: add these repo secrets (Settings → Secrets and variables →
# Actions). If they're absent the workflow still publishes the debug APK.
#   KEYSTORE_BASE64    base64 of the signing keystore
#   KEYSTORE_PASSWORD  keystore (store) password
#   KEY_ALIAS          key alias (e.g. analogplus)
#   KEY_PASSWORD       key password
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install generator dependencies
        run: pip install -r requirements.txt

      - name: Geometry and asset tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate face against Watch Face Format v3
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/validate.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Decode signing keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AnalogPlus-debug.apk
          if [ "$HAS_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AnalogPlus-release.apk
          fi
          ls -la dist

      - name: Clean up keystore
        if: always()
        run: rm -f app/keystore.jks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/*
